[tool.poetry]
name = 'first-kursovoy-saa'
version = '0.1.0'
description = 'Анализ банковских транзакций'
authors = ['Студент <student@example.com>']
package-mode = false

[tool.poetry.dependencies]
python = '^3.11'
pandas = '^2.0.0'
python-dotenv = "^1.2.1"

[tool.poetry.group.dev.dependencies]
flake8 = '^7.3.0'
pytest = '^9.0.1'
pytest-cov = '^7.0.0'
mypy = '^1.18.2'
black = '^25.9.0'
isort = '^6.1.0'

[build-system]
requires = ['poetry-core']
build-backend = 'poetry.core.masonry.api'